<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0A0A0A" stroke="#FF7A00" stroke-width="3"/>
  
  <!-- Trading Chart Line -->
  <polyline points="40,120 70,110 90,90 110,100 130,70 150,80 170,50" 
            fill="none" stroke="#00C853" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Up Arrow -->
  <polygon points="160,50 155,65 165,65" fill="#00C853"/>
  
  <!-- Currency Symbol (Dollar) -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00B0FF" text-anchor="middle">$</text>
  
  <!-- M Letter -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="28" font-weight="black" fill="#FF7A00" text-anchor="middle">M</text>
</svg>
