<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwathe Trade Systems</title>

    <!-- Browser Favicon / App Icon (SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M20 70 L35 45 L50 55 L65 30 L80 40' stroke='%2322c55e' stroke-width='6' fill='none' stroke-linecap='round'/><line x1='35' y1='35' x2='35' y2='60' stroke='%2338bdf8' stroke-width='2'/><line x1='65' y1='20' x2='65' y2='45' stroke='%2338bdf8' stroke-width='2'/><path d='M25 75 L40 35 L50 52 L60 35 L75 75' stroke='%23f97316' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 480px;
            width: 100%;
            margin: auto;
        }

        /* Dynamic Trading Logo */
        .logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 1.5rem;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.35));
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--accent-blue);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Action Button */
        .btn-action {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-green));
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Modern Trading M Logo -->
        <div class="logo-wrapper">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer Glow Container -->
                <rect width="100" height="100" rx="24" fill="#131d31" stroke="#1e293b" stroke-width="2"/>
                
                <!-- Candlestick Wicks -->
                <line x1="30" y1="20" x2="30" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
                <line x1="50" y1="15" x2="50" y2="85" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="2 2"/>
                <line x1="70" y1="25" x2="70" y2="75" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>

                <!-- Chart Trend Overlay -->
                <path d="M 15 65 L 35 40 L 50 55 L 68 25 L 85 35" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- Bold "M" Trading Structure -->
                <path d="M 22 75 L 38 32 L 50 52 L 62 32 L 78 75" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Pulse Dot -->
                <circle cx="68" cy="25" r="4" fill="#22c55e"/>
            </svg>
        </div>

        <h1 class="brand-title">MWATHE</h1>
        <div class="brand-subtitle">TRADE SYSTEMS</div>

        <p class="description">
            Next-generation algorithmic trading hub powered by 5th-order Markov probability state validation, real-time Shannon Entropy analysis, and sub-millisecond execution engines.
        </p>

        <!-- Properly Bound Target Button -->
        <button id="btn-login" class="btn-action">GET STARTED &rarr;</button>
    </div>

    <!-- Script loading at bottom of body to ensure DOM ready -->
    <script src="app.js"></script>
</body>
</html>
