<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwathe Trade Systems</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Mwathe Trade Systems</h1>
        <small id="status">Connecting...</small>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-title">Target Symbol</div>
            <div class="card-value" id="symbol-display">---</div>
        </div>
        <div class="card">
            <div class="card-title">Last Digit</div>
            <div class="card-value" id="digit-display">-</div>
        </div>
        <div class="card">
            <div class="card-title">Entropy</div>
            <div class="card-value" id="entropy-display">1.00</div>
        </div>
        <div class="card">
            <div class="card-title">Current Stake</div>
            <div class="card-value" id="stake-display">$1.00</div>
        </div>
    </div>

    <div class="log-box" id="terminal-log">
        <div class="log-entry">System ready. Waiting for WebSocket initialization...</div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
